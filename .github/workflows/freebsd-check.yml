name: FreeBSD Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd-check:
    runs-on: ubuntu-latest
    name: FreeBSD 15.1 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check on FreeBSD 15.1
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          sync: rsync
          usesh: true
          mem: 6144
          cpu: 4
          cache-after-prepare: true
          prepare: |
            pkg update -f

            # 1. Dynamically resolve Python package name (e.g. python312) and prefix (e.g. py312-)
            PY_PKG=$(pkg search -x '^python3[0-9]+$' | awk '{print $1}' | head -n1)
            
            # Fallback to python312 if detection returns empty
            if [ -z "$PY_PKG" ]; then
              PY_PKG="python312"
            fi

            # Extract major/minor version (e.g. 3.12 and py312)
            PY_RAW_VER=$(echo "$PY_PKG" | sed 's/python//')               # e.g. 312
            PY_DOT_VER=$(echo "$PY_RAW_VER" | sed 's/\([0-9]\)\([0-9]\{2\}\)/\1.\2/') # e.g. 3.12
            PY_PREFIX="py${PY_RAW_VER}-"                                  # e.g. py312-

            echo "Detected Python package: $PY_PKG"
            echo "Detected Python version: $PY_DOT_VER"
            echo "Detected Python package prefix: $PY_PREFIX"

            # 2. Install base system tools and dynamic Python packages
            pkg install -y \
              bash \
              cairo \
              cmake gmake \
              curl \
              gcc14 gcc15-devel gcc16-devel gcc17-devel \
              git gitup \
              libzmq4 \
              ninja \
              node22 npm-node22 \
              pango \
              pkgconf \
              "$PY_PKG" \
              "${PY_PREFIX}beautifulsoup" \
              "${PY_PREFIX}dill" \
              "${PY_PREFIX}hatchling" \
              "${PY_PREFIX}httpx" \
              "${PY_PREFIX}installer" \
              "${PY_PREFIX}ipykernel" \
              "${PY_PREFIX}lxml" \
              "${PY_PREFIX}matplotlib" \
              "${PY_PREFIX}mcp" \
              "${PY_PREFIX}nest-asyncio2" \
              "${PY_PREFIX}numpy" \
              "${PY_PREFIX}pandas" \
              "${PY_PREFIX}pillow" \
              "${PY_PREFIX}pydantic2" \
              "${PY_PREFIX}python-dotenv" \
              "${PY_PREFIX}pyyaml" \
              "${PY_PREFIX}pyzmq" \
              "${PY_PREFIX}requests" \
              "${PY_PREFIX}scipy" \
              "${PY_PREFIX}tomli"

            # 3. Dynamically create python3 and python symlinks from installed binary
            PY_BIN="/usr/local/bin/python${PY_DOT_VER}"
            if [ -f "$PY_BIN" ]; then
              ln -sf "$PY_BIN" /usr/local/bin/python3
              ln -sf "$PY_BIN" /usr/local/bin/python
            fi

            # 4. Update ports tree
            gitup ports

            # 5. Download and apply the patch from Bugzilla into /usr/ports
            curl -sSL "https://bz-attachments.freebsd.org/attachment.cgi?id=273749" -o /tmp/port.patch
            patch -p1 -d /usr/ports < /tmp/port.patch

            # 6. Build and install the new port non-interactively
            cd /usr/ports/devel/py-tyro
            make clean package install clean BATCH=yes

          run: |
            npm install
            # biome and tsgo ship no FreeBSD prebuilt binaries; use tsc
            npx tsc --noEmit
            cd packages/coding-agent && npx vitest --run test/config.test.ts
