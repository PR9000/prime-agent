name: FreeBSD Check

on:
  workflow_dispatch:

concurrency:
  group: freebsd-check
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  freebsd-check:
    runs-on: ubuntu-latest
    name: FreeBSD 15.1 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check on FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1-RELEASE"
          arch: ${{ matrix.arch }}
          cache-after-prepare: true
          prepare: |
            pkg install -y node22 npm-node22
          run: |
            npm install
            npm run check
            cd packages/coding-agent && npx vitest --run test/config.test.ts
